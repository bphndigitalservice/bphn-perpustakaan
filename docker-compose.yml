version: '3'

services:
  slims:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slims_app
    ports:
      - "80:80"
    volumes:
      - slims_files:/app/files
      - slims_images:/app/images
      - slims_repository:/app/repository
      - slims_config:/app/config
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=slims
      - DB_USER=slims
      - DB_PASSWORD=slims_password
    networks:
      - slims_network
    restart: always

  db:
    image: mariadb:10.3
    container_name: slims_db
    ports:
      - "3306:3306"
    volumes:
      - slims_db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=slims
      - MYSQL_USER=slims
      - MYSQL_PASSWORD=slims_password
    networks:
      - slims_network
    restart: always

networks:
  slims_network:

volumes:
  slims_db_data:
  slims_files:
  slims_images:
  slims_repository:
  slims_config:
